<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIBRA גיבורי על: המירוץ לסוף השנה</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Secular+One&display=swap");
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:Arial,"Segoe UI",Tahoma,"Arial Hebrew",sans-serif;font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}

/* ===== LIBRA superheroes theme ===== */
:root{--sun:#FFC20E;--sun-deep:#E9A400;--petal:rgba(255,194,14,.16);--surface:#17140D;--seed:#FFF5CF;--seed-soft:#D9C58A;--leaf:#8BE04E;--leaf-soft:rgba(139,224,78,.14);--rust:#FF7A4D;--line:rgba(255,194,14,.24);--bg:#0B0A07;--on-bg:#FFF5CF;--ink:#0B0A07;
  --metal:linear-gradient(180deg,#FFF3B8 0%,#FFD23A 28%,#B98600 52%,#FFE27A 74%,#9A7000 100%);color-scheme:dark}
body{background:#0B0A07 radial-gradient(80% 560px at 50% 0,rgba(255,194,14,.3),transparent 70%) no-repeat;color:var(--on-bg)}
.metal{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
h1,.display{font-family:"Secular One",Arial,"Segoe UI",Tahoma,"Arial Hebrew",sans-serif;font-weight:400;letter-spacing:0;line-height:1}
.kicker{margin:0 0 8px;font-weight:800;letter-spacing:.16em;color:var(--sun);font-size:15px}
.hero{border-bottom-color:var(--sun)}

.rh{--skin:#F1C79B;--neck:#E0B185;--hair:#0B0A07;--suit:#D8262B;--arm:#D8262B;--legs:#D8262B;--cover:#D8262B}
[data-race=sales] .rh{--cover-o:1;--cape-o:0;--mask-o:0;--mouth-o:0;--hairtop-o:0;--neck:#D8262B}
[data-race=sales] .rh.alt,[data-race=sales] .lane:nth-child(odd) .rh,[data-race=sales] .pl.second .rh{--suit:#C4202A;--arm:#E9B98C;--legs:#1F3A7A;--neck:#E0B185;--cover-o:0;--mouth-o:1;--hairtop-o:1;--long-o:1;--tiara-o:1;--hair:#1A1208}
[data-race=renewals] .rh{--skin:#63B33B;--neck:#4E9A2B;--suit:#63B33B;--arm:#63B33B;--legs:#221D12;--hair:#16240C;--cape-o:0;--mask-o:0}
[data-race=renewals] .heroes .rh{transform:scaleX(1.2)}
[data-race=apartments] .rh{--suit:#B3181E;--arm:#B3181E;--legs:#B3181E;--neck:#B3181E;--cover:#FFC83A;--cover-o:1;--hair:#B3181E;--cape-o:0;--mask-o:0;--mouth-o:0}

body{min-height:100vh;min-height:100svh;text-align:center;background:
  radial-gradient(60% 420px at 50% 230px,rgba(255,194,14,.55) 0%,rgba(255,194,14,.16) 40%,transparent 72%),
  repeating-conic-gradient(from 0deg at 50% 230px,rgba(255,194,14,.07) 0 6deg,transparent 6deg 12deg),
  linear-gradient(180deg,#0B0A07 0%,#1A1407 60%,#3A2A05 100%)}
.wrap{max-width:1040px;margin:0 auto;padding:36px 20px 56px}
.emblem{width:min(400px,74vw);height:auto;filter:drop-shadow(0 0 46px rgba(255,194,14,.6))}
h1{margin:6px 0 0;font-size:clamp(54px,11vw,124px)}
h1 .lat{display:block;font-family:Arial,sans-serif;font-weight:900;letter-spacing:.08em;font-size:.6em;line-height:1.1}
.lead{margin:14px auto 0;max-width:46ch;font-size:clamp(18px,2.4vw,22px);color:#FFF1B0}
.gate{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
.pickrace{display:flex;flex-direction:column;align-items:center;padding:20px 14px 18px;text-decoration:none;color:var(--on-bg);border-radius:8px;border:1px solid var(--line);border-top:4px solid var(--sun);background:linear-gradient(180deg,#221D12,#17140D);transition:transform .25s,box-shadow .25s}
.pickrace:hover,.pickrace:focus-visible{transform:translateY(-6px);box-shadow:0 18px 44px rgba(255,194,14,.28)}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.duo{display:flex;align-items:flex-end;justify-content:center;height:170px;filter:drop-shadow(0 0 22px rgba(255,194,14,.45))}
.duo svg{height:100%;width:auto}
[data-race=renewals] .duo .rh{transform:scaleX(1.2)}
.pickrace .nm{font-family:"Secular One",Arial,sans-serif;font-size:clamp(34px,5vw,54px);line-height:1.1;margin-top:10px}
.pickrace small{font-size:16px;color:var(--seed-soft);margin-top:4px}
footer{margin-top:36px;font-size:15px}
footer a{color:var(--sun)}
@media (max-width:720px){.wrap{padding-inline:16px}.gate{grid-template-columns:1fr;gap:12px}.pickrace{flex-direction:row;gap:14px;text-align:right;padding:12px 14px}.duo{height:96px;flex:0 0 auto}.pickrace .txt{display:flex;flex-direction:column}}
@media (prefers-reduced-motion:reduce){.pickrace{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3B8"/><stop offset=".3" stop-color="#FFD23A"/>
      <stop offset=".55" stop-color="#B98600"/><stop offset=".78" stop-color="#FFE27A"/><stop offset="1" stop-color="#8A6400"/>
    </linearGradient>
    <linearGradient id="g-cape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD23A"/><stop offset="1" stop-color="#A66E00"/></linearGradient>
    <linearGradient id="g-suit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3423"/><stop offset="1" stop-color="#0B0A07"/></linearGradient>

    <!-- גיבור מעופף, פונה שמאלה (כיוון ההתקדמות ב-RTL) -->
    <symbol id="flyer" viewBox="0 0 124 60">
      <path d="M44 22 Q78 -2 122 8 Q98 22 118 40 Q82 30 50 34 Z" fill="url(#g-cape)" stroke="#5E4500" stroke-width="1.5" style="opacity:var(--cape-o,1)"/>
      <path d="M30 17 Q56 4 84 16 Q60 15 36 26 Z" style="fill:var(--hair);opacity:var(--long-o,0)"/>
      <path d="M66 25 L114 30 L114 39 L66 37 Z" stroke="#0B0A07" stroke-width="1.5" style="fill:var(--legs)"/>
      <path d="M102 29 L116 30 L116 40 L102 39 Z" fill="url(#g-gold)" stroke="#5E4500"/>
      <path d="M30 23 L70 23 Q79 30 70 38 L34 38 Z" stroke="#0B0A07" stroke-width="1.5" style="fill:var(--suit)"/>
      <circle cx="52" cy="30.5" r="5" fill="url(#g-gold)" stroke="#5E4500"/><path d="M50 27.5v6h4" stroke="#0B0A07" stroke-width="1.6" fill="none"/>
      <path d="M34 30 L8 25 L8 32 L32 38 Z" stroke="#0B0A07" stroke-width="1.5" style="fill:var(--arm)"/>
      <circle cx="6" cy="28.5" r="5" stroke="#0B0A07" stroke-width="1.2" style="fill:var(--arm)"/>
      <circle cx="25" cy="25" r="9.5" stroke="#0B0A07" stroke-width="1.2" style="fill:var(--skin)"/>
      <circle cx="25" cy="25" r="9.5" stroke="#0B0A07" stroke-width="1.2" style="fill:var(--cover);opacity:var(--cover-o,0)"/>
      <path d="M15.600 23 Q25 18 34.400 23 L34 27.500 Q25 24 16 27.500 Z" fill="#0B0A07" style="opacity:var(--mask-o,1)"/>
      <path d="M17 17 Q26 9 35 19 Q26 15 17 17Z" style="fill:var(--hair);opacity:var(--hairtop-o,1)"/>
      <path d="M16 19 Q25 13 34 20 L34 22.500 Q25 16.500 16 21.500Z" fill="url(#g-gold)" style="opacity:var(--tiara-o,0)"/>
      <ellipse cx="19.500" cy="25" rx="3" ry="2" fill="#fff" style="opacity:var(--cover-o,0)"/>
    </symbol>

    <!-- גיבור עומד -->
    <symbol id="hero" viewBox="0 0 200 300">
      <path d="M58 82 Q100 62 142 82 L184 276 Q100 240 16 276 Z" fill="url(#g-cape)" stroke="#5E4500" stroke-width="2" style="opacity:var(--cape-o,1)"/>
      <path d="M73 46 Q58 110 68 150 L132 150 Q142 110 127 46 Z" style="fill:var(--hair);opacity:var(--long-o,0)"/>
      <path d="M77 170 L99 170 L97 262 L73 262 Z M101 170 L123 170 L127 262 L103 262 Z" stroke="#0B0A07" stroke-width="2" style="fill:var(--legs)"/>
      <path d="M71 256 L99 256 L98 288 L66 288 Z M101 256 L129 256 L134 288 L102 288 Z" fill="url(#g-gold)" stroke="#5E4500" stroke-width="2"/>
      <path d="M60 84 L140 84 L123 174 L77 174 Z" stroke="#0B0A07" stroke-width="2" style="fill:var(--suit)"/>
      <path d="M61 86 L36 130 L64 152 L72 141 L56 127 L74 98 Z M139 86 L164 130 L136 152 L128 141 L144 127 L126 98 Z" stroke="#0B0A07" stroke-width="2" style="fill:var(--arm)"/>
      <circle cx="68" cy="147" r="8" stroke="#0B0A07" style="fill:var(--arm)"/><circle cx="132" cy="147" r="8" stroke="#0B0A07" style="fill:var(--arm)"/>
      <rect x="76" y="163" width="48" height="11" rx="2" fill="url(#g-gold)" stroke="#5E4500"/>
      <circle cx="100" cy="116" r="19" fill="url(#g-gold)" stroke="#5E4500" stroke-width="2"/>
      <path d="M93 105 v22 h15" stroke="#0B0A07" stroke-width="6" fill="none" stroke-linejoin="round"/>
      <rect x="91" y="72" width="18" height="16" style="fill:var(--neck)"/>
      <circle cx="100" cy="54" r="25" stroke="#0B0A07" stroke-width="2" style="fill:var(--skin)"/>
      <circle cx="100" cy="54" r="25" stroke="#0B0A07" stroke-width="2" style="fill:var(--cover);opacity:var(--cover-o,0)"/>
      <path d="M75.500 49 Q100 38 124.500 49 L123.500 60 Q100 52 76.500 60 Z" fill="#0B0A07" style="opacity:var(--mask-o,1)"/>
      <path d="M76 44 Q84 22 106 27 Q122 28 124 46 Q104 34 76 44Z" style="fill:var(--hair);opacity:var(--hairtop-o,1)"/>
      <path d="M76 41 Q100 28 124 41 L124 48 Q100 36 76 48Z M100 30 l5 8 h-10z" fill="url(#g-gold)" stroke="#5E4500" style="opacity:var(--tiara-o,0)"/>
      <ellipse cx="90" cy="53" rx="5" ry="3" fill="#fff"/><ellipse cx="110" cy="53" rx="5" ry="3" fill="#fff"/>
      <path d="M92 66 Q100 71 108 66" stroke="#7A4A22" stroke-width="2" fill="none" stroke-linecap="round" style="opacity:var(--mouth-o,1)"/>
    </symbol>

    <!-- סמל -->
    <symbol id="emblem" viewBox="0 0 440 300">
      <g fill="url(#g-gold)" stroke="#5E4500" stroke-width="3" stroke-linejoin="round">
        <path d="M150 110 L18 62 L52 112 L8 112 L60 154 L28 166 L150 200 Z"/>
        <path d="M290 110 L422 62 L388 112 L432 112 L380 154 L412 166 L290 200 Z"/>
      </g>
      <path d="M220 14 L318 62 L318 180 Q318 244 220 288 Q122 244 122 180 L122 62 Z" fill="url(#g-gold)" stroke="#5E4500" stroke-width="4" transform="translate(0,0)"/>
      <path d="M220 36 L298 74 L298 178 Q298 230 220 266 Q142 230 142 178 L142 74 Z" fill="#0B0A07"/>
      <path d="M186 84 L222 84 L222 186 L262 186 L262 218 L186 218 Z" fill="url(#g-gold)" stroke="#FFF3B8" stroke-width="2"/>
      <path d="M250 70 L232 122 L252 122 L238 166 L282 108 L260 108 L274 70 Z" fill="#FFF3B8" stroke="#B98600" stroke-width="2"/>
    </symbol>
  </defs></svg>
<div class="wrap">
  <header>
    <svg class="emblem" viewBox="0 0 440 300" role="img" aria-label="סמל LIBRA גיבורי על"><use href="#emblem"/></svg>
    <h1><span class="lat metal">LIBRA</span><span class="metal">גיבורי על</span></h1>
    <p class="lead">המירוץ לסוף השנה. בוחרים מחלקה, מכניסים שם ורואים איפה עומדים, כמה נשאר ומה הקצב שצריך.</p>
  </header>
  <nav class="gate" aria-label="בחירת מירוץ">
    <a class="pickrace" data-race="sales" href="/sales"><span class="duo" aria-hidden="true"><svg class="rh" viewBox="0 0 200 300"><use href="#hero"/></svg><svg class="rh alt" viewBox="0 0 200 300"><use href="#hero"/></svg></span><span class="txt"><span class="nm metal">מכירות</span><small>קסקו צד ג׳ וקסקו מקיף, פוליסות חדשות</small></span></a>
    <a class="pickrace" data-race="renewals" href="/renewals"><span class="duo" aria-hidden="true"><svg class="rh" viewBox="0 0 200 300"><use href="#hero"/></svg></span><span class="txt"><span class="nm metal">חידושים</span><small>צוות דיגיטל וצוות מוקד</small></span></a>
    <a class="pickrace" data-race="apartments" href="/apartments"><span class="duo" aria-hidden="true"><svg class="rh" viewBox="0 0 200 300"><use href="#hero"/></svg></span><span class="txt"><span class="nm metal">דירות</span><small>מבנה, תכולה ומבנה + תכולה</small></span></a>
  </nav>
  <footer><a href="/admin">כניסת מנהלים</a></footer>
</div>
</body>
</html>
